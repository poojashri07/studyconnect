name: Security Review

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install security dependencies
        run: |
          npm install
          npm install exceljs --save-dev
          mkdir -p Test_Results/Security
          export NODE_PATH=$GITHUB_WORKSPACE/node_modules

      - name: Run backend security suite
        run: |
          export NODE_PATH=$GITHUB_WORKSPACE/node_modules
          node BrainBattleBackend/scripts/generateSecuritySuite.js

      - name: Enforce zero critical policy
        run: |
          if grep -R "Critical" -n Test_Results/Security | grep -E "[1-9]"; then
            echo "Critical findings detected"; exit 1
          fi

      - name: Write step summary
        run: |
          echo "## Backend Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security report: [security review](Test_Results/Security/security-review.md)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency report: [dependency report](Test_Results/Security/dependency-report.md)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executive summary: [executive summary](Test_Results/Security/executive-summary.md)" >> "$GITHUB_STEP_SUMMARY"
