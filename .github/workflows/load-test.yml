name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Local application URL'
        required: false
        default: 'http://127.0.0.1:5000/'
  push:
    branches:
      - main

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start application and run load test
        continue-on-error: true
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'http://127.0.0.1:5000/' }}
          VUS: 20
          DURATION_SECONDS: 30
          MAX_FAILURE_RATE: 0.05
        run: |
          set -e
          npm start > app.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for i in {1..40}; do
            if curl -sf "$TARGET_URL" > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for local server..."
            sleep 2
          done
          sleep 5
          npm run test:load || true

      - name: Ensure load test Excel summary exists
        if: always()
        run: |
          if [ ! -f load-test-summary.xlsx ]; then
            node -e "const xlsx=require('xlsx'); const wb=xlsx.utils.book_new(); const ws=xlsx.utils.aoa_to_sheet([['Status','No report generated']]); xlsx.utils.book_append_sheet(wb, ws, 'Load Test Summary'); xlsx.writeFile(wb, 'load-test-summary.xlsx');"
          fi

      - name: Upload load test Excel summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: load-test-summary.xlsx
