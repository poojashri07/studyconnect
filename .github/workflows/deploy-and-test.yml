name: Deploy and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live deployment URL to test'
        required: false
        default: ''

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    env:
      RENDER_URL: ${{ secrets.RENDER_URL || '' }}
      BASE_URL: ${{ github.event.inputs.base_url || secrets.RENDER_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      NODE_PATH: ${{ github.workspace }}/node_modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "No build step required for static site"

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.base_url == '' && env.RENDER_URL == '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: /

      - name: Show target URL
        run: |
          echo "BASE_URL=$BASE_URL"

      - name: Wait for deployment
        run: |
          for i in {1..20}; do
            status=$(curl -o /dev/null -s -w "%{http_code}" "$BASE_URL")
            if [ "$status" = "200" ]; then
              echo "Deployment live"
              exit 0
            fi
            echo "Waiting for deployment... ($status)"
            sleep 6
          done
          echo "Deployment did not become available"
          exit 1

      - name: Verify deployment assets
        run: |
          html_status=$(curl -o /dev/null -s -w "%{http_code}" "$BASE_URL")
          if [ "$html_status" != "200" ]; then
            echo "Deployment verification failed"
            exit 1
          fi
          echo "Deployment verification passed"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run live Selenium automation
        run: |
          npm run test:automation
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-artifacts
          path: |
            automation/reports/Automation_Test_Report.xlsx
            automation/reports/execution-report.html
            automation/reports/summary.md
            automation/reports/execution-results.json
            automation/screenshots/**
            automation/logs/**

      - name: Publish summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat automation/reports/summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded: automation-artifacts" >> $GITHUB_STEP_SUMMARY
